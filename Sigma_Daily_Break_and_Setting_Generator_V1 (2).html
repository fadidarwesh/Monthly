<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sigma Daily Physical Test Results Generator</title>
<style>
:root{--navy:#123f54;--teal:#0c7c78;--ink:#20323b;--muted:#687b84;--line:#cbdde2;--pale:#eaf4f5;--cream:#fff8e7;--orange:#f28c28;--good:#287a55;--shadow:0 14px 36px rgba(18,63,84,.12)}
*{box-sizing:border-box}body{margin:0;background:#f3f7f8;color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif}button,input{font:inherit}.app{max-width:920px;margin:auto;padding:22px}.hero{background:linear-gradient(135deg,var(--navy),#165d70);color:#fff;border-radius:18px;padding:20px 24px;box-shadow:var(--shadow)}.hero h1{margin:0 0 6px;font-size:clamp(22px,3vw,31px)}.hero p{margin:0;color:#d9edf0;line-height:1.55}.panel{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}.controls{display:grid;grid-template-columns:1.6fr 1fr auto;gap:12px;align-items:end}.field label{display:block;font-weight:700;margin-bottom:7px;color:var(--navy)}input[type=file],input[type=date]{width:100%;min-height:44px;border:1px solid #a9c5cc;border-radius:9px;background:#fff;padding:8px 10px;color:var(--ink)}button{border:0;border-radius:9px;padding:11px 16px;min-height:44px;font-weight:800;cursor:pointer}.primary{background:var(--teal);color:#fff}.secondary{background:#e6f1f2;color:var(--navy)}button:disabled{opacity:.45;cursor:not-allowed}.status{margin-top:11px;padding:10px 12px;border-radius:9px;background:var(--pale);color:var(--navy);line-height:1.5}.status.error{background:#fdecec;color:#8b2424}.report{max-width:760px;margin:18px auto 0;background:#fff;border:1px solid #b7cbd0;box-shadow:var(--shadow)}.report-title{background:#d9eeee;color:#123f54;padding:7px 8px;font-size:15px;font-weight:800;letter-spacing:.1px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;table-layout:fixed}th{background:#147985;color:#fff;padding:10px 7px;font-size:12px;white-space:nowrap;border:1px solid #d5ecee}td{border:1.5px solid var(--orange);padding:6px 7px;text-align:center;background:var(--cream);font-size:13px;height:29px}td.test{width:25%;background:#eaf3f7;border-color:#c2d4da;color:#162c39;font-weight:700;vertical-align:middle}td.product{width:35%;font-weight:700}td.date{width:20%;white-space:nowrap}td.result{width:20%;font-weight:700}.empty{padding:22px;text-align:center;background:#fafcfc;color:var(--muted)}.actions{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;max-width:760px;margin:10px auto 0}.hidden{display:none!important}
@media(max-width:760px){.app{padding:10px}.controls{grid-template-columns:1fr}.actions button{flex:1}.hero,.panel{border-radius:12px}.report{width:100%}th,td{font-size:11px;padding:5px 4px}.report-title{font-size:13px}}
@media print{body{background:#fff}.app{max-width:none;padding:0}.hero,.panel,.actions{display:none!important}.report{margin:0 auto;border:1px solid #b7cbd0;box-shadow:none;width:100%;max-width:760px}table{font-size:9pt}@page{size:A4 portrait;margin:10mm}}
</style>
</head>
<body>
<main class="app">
  <section class="hero">
    <h1>Daily Physical Test Results Generator</h1>
    <p>Select the approved tracker and the break date. The generator returns one compact, screenshot-ready table.</p>
  </section>
  <section class="panel">
    <div class="controls">
      <div class="field"><label for="file">Approved tracker (.xlsx)</label><input id="file" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></div>
      <div class="field"><label for="date">Break date</label><input id="date" type="date" disabled></div>
      <button id="show" class="primary" disabled>Show results</button>
    </div>
    <div id="status" class="status">Select <b>cement_physical_lab_tracker</b> to start.</div>
  </section>

  <section id="report" class="report hidden">
    <div class="report-title">PHYSICAL TEST RESULTS — MANUAL ENTRY</div>
    <div id="compactBox" class="table-wrap"></div>
  </section>
  <div id="actions" class="actions hidden"><button id="excel" class="primary">Export Excel</button><button id="pdf" class="secondary">Print / Save PDF</button></div>
</main>
<script>
"use strict";
const $=s=>document.querySelector(s),te=new TextEncoder(),td=new TextDecoder();
let loaded=null,current=null;
const finite=v=>typeof v==="number"&&Number.isFinite(v);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function xmlEncode(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function xmlDecode(v){return String(v??"").replace(/&#(\d+);/g,(_,n)=>String.fromCharCode(+n)).replace(/&#x([0-9a-f]+);/gi,(_,n)=>String.fromCharCode(parseInt(n,16))).replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&")}
function colOf(ref){return (String(ref).match(/[A-Z]+/)||[""])[0]}
function colName(n){let s="";while(n){n--;s=String.fromCharCode(65+n%26)+s;n=Math.floor(n/26)}return s}
function bytes(s){return te.encode(s)}
function joinBytes(parts){const n=parts.reduce((s,p)=>s+p.length,0),o=new Uint8Array(n);let k=0;for(const p of parts){o.set(p,k);k+=p.length}return o}
function dateKey(v){if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);if(finite(v)){const ms=Date.UTC(1899,11,30)+Math.round(v)*86400000;return new Date(ms).toISOString().slice(0,10)}const s=String(v??"").trim();if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);const d=new Date(s);return isNaN(d)?"":d.toISOString().slice(0,10)}
function arDate(s){return displayDate(s)}
function displayDate(s){if(!s)return"—";const [y,m,d]=s.split("-"),months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return`${d}-${months[Number(m)-1]}-${y}`}
function clean(v){return String(v??"").trim().replace(/\s+/g," ")}
function safeFile(v){return String(v).replace(/[\\/:*?"<>|]+/g,"_").replace(/\s+/g,"_")}
function setStatus(t,error=false){const e=$("#status");e.innerHTML=t;e.classList.toggle("error",error)}

class ZipReader{
  constructor(buffer){this.buffer=buffer;this.view=new DataView(buffer);this.entries=new Map();this.parse()}
  u16(o){return this.view.getUint16(o,true)} u32(o){return this.view.getUint32(o,true)}
  parse(){let e=-1;for(let i=this.buffer.byteLength-22;i>=Math.max(0,this.buffer.byteLength-65557);i--){if(this.u32(i)===0x06054b50){e=i;break}}if(e<0)throw Error("The selected file is not a valid XLSX file");const count=this.u16(e+10),start=this.u32(e+16);let p=start;for(let i=0;i<count;i++){if(this.u32(p)!==0x02014b50)throw Error("Could not read the XLSX directory");const method=this.u16(p+10),cs=this.u32(p+20),nl=this.u16(p+28),el=this.u16(p+30),cl=this.u16(p+32),lo=this.u32(p+42),name=td.decode(new Uint8Array(this.buffer,p+46,nl));this.entries.set(name,{method,cs,lo});p+=46+nl+el+cl}}
  async getBytes(name){const e=this.entries.get(name);if(!e)throw Error(`Missing workbook part: ${name}`);const nl=this.u16(e.lo+26),el=this.u16(e.lo+28),start=e.lo+30+nl+el,input=new Uint8Array(this.buffer,start,e.cs);if(e.method===0)return new Uint8Array(input);if(e.method===8){const stream=new Blob([input]).stream().pipeThrough(new DecompressionStream("deflate-raw"));return new Uint8Array(await new Response(stream).arrayBuffer())}throw Error(`Unsupported ZIP compression: ${e.method}`)}
  async text(name){return td.decode(await this.getBytes(name))}
}
function sharedStrings(xml){if(!xml)return[];const out=[];let m;const re=/<si\b[^>]*>([\s\S]*?)<\/si>/g;while((m=re.exec(xml))){let t="",q;const tr=/<t\b[^>]*>([\s\S]*?)<\/t>/g;while((q=tr.exec(m[1])))t+=xmlDecode(q[1]);out.push(t)}return out}
function parseCells(inner,shared){const out={};let m;const re=/<c\b([^>]*?\br="([A-Z]+\d+)"[^>]*?)(?:\s*\/>|>([\s\S]*?)<\/c>)/g;while((m=re.exec(inner))){const attrs=m[1],ref=m[2],body=m[3];if(body===undefined)continue;const type=(attrs.match(/\bt="([^"]+)"/)||[])[1];let value=null;if(type==="inlineStr"){let q,t="";const tr=/<t\b[^>]*>([\s\S]*?)<\/t>/g;while((q=tr.exec(body)))t+=xmlDecode(q[1]);value=t}else{const vm=body.match(/<v>([\s\S]*?)<\/v>/);if(!vm)continue;const raw=xmlDecode(vm[1]);if(type==="s")value=shared[Number(raw)]??"";else if(type==="str")value=raw;else{const n=Number(raw);value=Number.isFinite(n)?n:raw}}out[colOf(ref)]=value}return out}
function parseRows(xml,shared,fn){let m;const re=/<row\b[^>]*\br="(\d+)"[^>]*>([\s\S]*?)<\/row>/g;while((m=re.exec(xml)))fn(Number(m[1]),parseCells(m[2],shared))}
function attrValue(s,name){const m=String(s).match(new RegExp(`(?:^|\\s)${name.replace(":","\\:")}="([^"]*)"`));return m?xmlDecode(m[1]):""}
function workbookSheetPaths(workbookXml,relsXml){const rels={},paths={};let m;const rr=/<Relationship\b([^>]*)\/>/g;while((m=rr.exec(relsXml))){const id=attrValue(m[1],"Id"),target=attrValue(m[1],"Target"),type=attrValue(m[1],"Type");if(id&&target&&/worksheet$/.test(type)){let path=target.startsWith("/")?target.replace(/^\/+/,""):"xl/"+target;rels[id]=path.replace(/^xl\/xl\//,"xl/")}}const sr=/<sheet\b([^>]*)\/>/g;while((m=sr.exec(workbookXml))){const name=attrValue(m[1],"name"),id=attrValue(m[1],"r:id");if(name&&rels[id])paths[name]=rels[id]}return paths}

async function loadSource(file){
  const zip=new ZipReader(await file.arrayBuffer()),shared=sharedStrings(zip.entries.has("xl/sharedStrings.xml")?await zip.text("xl/sharedStrings.xml"):"");
  const wb=await zip.text("xl/workbook.xml"),rels=await zip.text("xl/_rels/workbook.xml.rels"),paths=workbookSheetPaths(wb,rels);
  const path=paths["Daily Tracker"]||Object.values(paths)[0];if(!path)throw Error("Daily Tracker sheet was not found");
  const records=[];parseRows(await zip.text(path),shared,(rn,c)=>{if(rn<43)return;const hasData=c.B||c.C||c.J||c.K||c.N||c.Q||c.AF;if(!hasData)return;records.push({row:rn,sampleDate:dateKey(c.B),product:clean(c.C),source:clean(c.F),qc:clean(c.H),rnd:clean(c.I),sampleId:clean(c.J),break2:dateKey(c.K),strength2:finite(c.L)?c.L:null,castingDate:dateKey(c.M),break7:dateKey(c.N),strength7:finite(c.O)?c.O:null,break28:dateKey(c.Q),strength28:finite(c.R)?c.R:null,setting:finite(c.AF)?c.AF:null})});
  if(!records.length)throw Error("No laboratory records were found from row 43 onward");
  const dates=new Set();for(const r of records){if(r.strength2>0&&r.break2)dates.add(r.break2);if(r.strength7>0&&r.break7)dates.add(r.break7);if(r.strength28>0&&r.break28)dates.add(r.break28);const settingDate=r.castingDate||r.sampleDate;if(r.setting>0&&settingDate)dates.add(settingDate)}
  return{records,dates:[...dates].sort(),sourceName:file.name};
}
function sampleName(r){return r.sampleId||r.qc||r.rnd||r.source||"Not recorded"}
function collectDay(data,day){
  const strengths=[],settings=[];for(const r of data.records){const base={row:r.row,product:r.product||"Not recorded",sampleId:sampleName(r),sampleDate:r.sampleDate,castingDate:r.castingDate,source:r.source};if(r.break2===day&&r.strength2>0)strengths.push({...base,age:"2D",ageOrder:2,result:r.strength2});if(r.break7===day&&r.strength7>0)strengths.push({...base,age:"7D",ageOrder:7,result:r.strength7});if(r.break28===day&&r.strength28>0)strengths.push({...base,age:"28D",ageOrder:28,result:r.strength28});const settingDate=r.castingDate||r.sampleDate;if(settingDate===day&&r.setting>0)settings.push({...base,settingDate,result:r.setting})}
  strengths.sort((a,b)=>a.ageOrder-b.ageOrder||a.product.localeCompare(b.product)||a.row-b.row);settings.sort((a,b)=>a.product.localeCompare(b.product)||a.row-b.row);
  return{day,strengths,settings,counts:{d2:strengths.filter(x=>x.age==="2D").length,d7:strengths.filter(x=>x.age==="7D").length,d28:strengths.filter(x=>x.age==="28D").length,setting:settings.length},sourceName:data.sourceName};
}
function productDisplay(r){const product=clean(r.product)||"Not recorded",id=clean(r.sampleId);if(!id||/^mill(?:\s|$)/i.test(id)||/^mill sample$/i.test(id))return product;const normalized=id.replace(/^QC[-\s]*/i,"QC ").replace(/\s+/g," ");if(product.toLowerCase().includes(normalized.toLowerCase()))return product;return`${normalized} ${product}`.trim()}
function compactGroups(c){const groups=[];if(c.settings.length)groups.push({test:"Initial Setting (min)",rows:c.settings.map(r=>({...r,displayResult:`${Math.round(r.result)} min`}))});for(const age of ["2D","7D","28D"]){const rows=c.strengths.filter(r=>r.age===age);if(rows.length)groups.push({test:`${age.replace("D","-Day")} Strength (MPa)`,rows:rows.map(r=>({...r,displayResult:Number(r.result).toFixed(2)}))})}return groups}
function render(c){
  current=c;const groups=compactGroups(c);$("#report").classList.remove("hidden");$("#actions").classList.remove("hidden");
  if(!groups.length){$("#compactBox").innerHTML=`<div class="empty">No physical test results were recorded on this date.</div>`;setStatus(`No completed results were found for ${arDate(c.day)}.`);return}
  let body="";for(const g of groups){g.rows.forEach((r,i)=>{body+=`<tr>${i===0?`<td class="test" rowspan="${g.rows.length}">${esc(g.test)}</td>`:""}<td class="product">${esc(productDisplay(r))}</td><td class="date">${displayDate(r.sampleDate)}</td><td class="result">${esc(r.displayResult)}</td></tr>`})}
  $("#compactBox").innerHTML=`<table><colgroup><col style="width:25%"><col style="width:35%"><col style="width:20%"><col style="width:20%"></colgroup><thead><tr><th>Test</th><th>Product ▼</th><th>Sample Date</th><th>Today's Result</th></tr></thead><tbody>${body}</tbody></table>`;
  setStatus(`Ready for screenshot: ${c.strengths.length} strength result(s) and ${c.settings.length} setting result(s) for ${arDate(c.day)}.`);
}

const crcTable=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?0xedb88320^(c>>>1):c>>>1;crcTable[n]=c>>>0}
function crc32(data){let c=0xffffffff;for(const b of data)c=crcTable[(c^b)&255]^(c>>>8);return(c^0xffffffff)>>>0}
function w16(a,o,v){new DataView(a.buffer).setUint16(o,v,true)}function w32(a,o,v){new DataView(a.buffer).setUint32(o,v>>>0,true)}
class ZipWriter{constructor(){this.files=[]}add(name,data){data=typeof data==="string"?bytes(data):data;this.files.push({name,nameBytes:bytes(name),data,crc:crc32(data)})}build(){const local=[],central=[];let offset=0;for(const f of this.files){const lo=offset,h=new Uint8Array(30);w32(h,0,0x04034b50);w16(h,4,20);w16(h,6,0);w16(h,8,0);w32(h,10,0);w32(h,14,f.crc);w32(h,18,f.data.length);w32(h,22,f.data.length);w16(h,26,f.nameBytes.length);local.push(h,f.nameBytes,f.data);offset+=h.length+f.nameBytes.length+f.data.length;const c=new Uint8Array(46);w32(c,0,0x02014b50);w16(c,4,20);w16(c,6,20);w16(c,8,0);w16(c,10,0);w32(c,12,0);w32(c,16,f.crc);w32(c,20,f.data.length);w32(c,24,f.data.length);w16(c,28,f.nameBytes.length);w32(c,42,lo);central.push(c,f.nameBytes)}const cdStart=offset,cdSize=central.reduce((s,x)=>s+x.length,0),end=new Uint8Array(22);w32(end,0,0x06054b50);w16(end,8,this.files.length);w16(end,10,this.files.length);w32(end,12,cdSize);w32(end,16,cdStart);return joinBytes([...local,...central,end])}}
function xcell(v,s=5){return{v,s}}function xdate(day){return{v:(Date.parse(day+"T00:00:00Z")-Date.UTC(1899,11,30))/86400000,s:7}}
function sheetCellXml(ref,c){if(c===null||c===undefined||c==="")return"";if(typeof c!=="object"||Array.isArray(c))c={v:c,s:typeof c==="number"?6:5};const s=Number.isInteger(c.s)?` s="${c.s}"`:"",v=c.v;if(v===null||v===undefined||v==="")return"";if(typeof v==="number"&&Number.isFinite(v))return`<c r="${ref}"${s}><v>${v}</v></c>`;return`<c r="${ref}" t="inlineStr"${s}><is><t xml:space="preserve">${xmlEncode(v)}</t></is></c>`}
function worksheetXml(rows,merges){let data="";for(let r=0;r<rows.length;r++){let cells="";for(let c=0;c<(rows[r]||[]).length;c++)cells+=sheetCellXml(colName(c+1)+(r+1),rows[r][c]);const ht=r===0?24:r===1?27:22;data+=`<row r="${r+1}" ht="${ht}" customHeight="1">${cells}</row>`}return`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><dimension ref="A1:D${rows.length}"/><sheetViews><sheetView workbookViewId="0"><pane ySplit="2" topLeftCell="A3" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="A3" sqref="A3"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="22"/><cols><col min="1" max="1" width="25" customWidth="1"/><col min="2" max="2" width="43" customWidth="1"/><col min="3" max="3" width="19" customWidth="1"/><col min="4" max="4" width="21" customWidth="1"/></cols><sheetData>${data}</sheetData><mergeCells count="${merges.length}">${merges.map(x=>`<mergeCell ref="${x}"/>`).join("")}</mergeCells><pageMargins left="0.25" right="0.25" top="0.35" bottom="0.35" header="0.15" footer="0.15"/><pageSetup orientation="portrait" paperSize="9" fitToWidth="1" fitToHeight="1"/></worksheet>`}

function buildWorkbook(c){
  const S={title:1,sub:2,section:3,head:4,body:5,result:6,date:7,intResult:8,good:9,note:10},rows=[],merges=[];
  rows.push([xcell("نتائج الكسر والتصلب اليومية — SIGMA",S.title)]);merges.push("A1:F1");
  rows.push([xcell(`تاريخ الكسر: ${displayDate(c.day)} | المصدر: ${c.sourceName}`,S.sub)]);merges.push("A2:F2");
  rows.push([xcell(`2D: ${c.counts.d2}  |  7D: ${c.counts.d7}  |  28D: ${c.counts.d28}  |  Initial Setting: ${c.counts.setting}`,S.good)]);merges.push("A3:F3");rows.push([]);
  rows.push([xcell("عمر الكسر",S.head),xcell("المنتج",S.head),xcell("اسم / رقم العينة",S.head),xcell("تاريخ العينة",S.head),xcell("تاريخ الصب",S.head),xcell("نتيجة الكسر (MPa)",S.head)]);
  c.strengths.forEach(r=>rows.push([xcell(r.age,S.body),xcell(r.product,S.body),xcell(r.sampleId,S.body),r.sampleDate?xdate(r.sampleDate):null,r.castingDate?xdate(r.castingDate):null,xcell(r.result,S.result)]));
  if(!c.strengths.length){rows.push([xcell("لا توجد نتائج كسر مدخلة في هذا التاريخ.",S.note)]);merges.push(`A${rows.length}:F${rows.length}`)}const strengthEnd=rows.length;
  rows.push([]);rows.push([xcell("زمن التصلب المفحوص في اليوم نفسه",S.section)]);merges.push(`A${rows.length}:F${rows.length}`);
  rows.push([xcell("الفحص",S.head),xcell("المنتج",S.head),xcell("اسم / رقم العينة",S.head),xcell("تاريخ العينة",S.head),xcell("تاريخ الصب",S.head),xcell("النتيجة (دقيقة)",S.head)]);
  c.settings.forEach(r=>rows.push([xcell("Initial Setting",S.body),xcell(r.product,S.body),xcell(r.sampleId,S.body),r.sampleDate?xdate(r.sampleDate):null,r.castingDate?xdate(r.castingDate):null,xcell(Math.round(r.result),S.intResult)]));
  if(!c.settings.length){rows.push([xcell("لا يوجد زمن تصلب مسجل في هذا التاريخ.",S.note)]);merges.push(`A${rows.length}:F${rows.length}`)}
  rows.push([]);rows.push([xcell("النتيجة الفارغة أو الصفرية لا تُعامل كاختبار منفذ. تاريخ الكسر من أعمدة 2D / 7D / 28D، وزمن التصلب من تاريخ التحضير/الصب، مع استخدام تاريخ العينة فقط عند غيابه.",S.note)]);merges.push(`A${rows.length}:F${rows.length}`);
  const z=new ZipWriter(),created=new Date().toISOString();z.add("[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/><Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/></Types>`);z.add("_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/></Relationships>`);z.add("docProps/core.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>Sigma Daily Break Results</dc:title><dc:creator>Sigma QC Generator</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${created}</dcterms:created></cp:coreProperties>`);z.add("docProps/app.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties" xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes"><Application>Sigma QC Generator</Application><HeadingPairs><vt:vector size="2" baseType="variant"><vt:variant><vt:lpstr>Worksheets</vt:lpstr></vt:variant><vt:variant><vt:i4>1</vt:i4></vt:variant></vt:vector></HeadingPairs><TitlesOfParts><vt:vector size="1" baseType="lpstr"><vt:lpstr>نتائج اليوم</vt:lpstr></vt:vector></TitlesOfParts></Properties>`);z.add("xl/workbook.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView activeTab="0" firstSheet="0" showSheetTabs="1"/></bookViews><sheets><sheet name="نتائج اليوم" sheetId="1" state="visible" r:id="rId1"/></sheets><calcPr calcMode="auto"/></workbook>`);z.add("xl/_rels/workbook.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`);z.add("xl/styles.xml",stylesXml());z.add("xl/worksheets/sheet1.xml",worksheetXml(rows,merges,strengthEnd));return z.build();
}
function buildCompactWorkbook(c){
  const S={title:1,test:3,head:4,result:6,date:7,cream:8},rows=[],merges=[],groups=compactGroups(c);
  rows.push([xcell("PHYSICAL TEST RESULTS — MANUAL ENTRY",S.title)]);merges.push("A1:D1");
  rows.push([xcell("Test",S.head),xcell("Product ▼",S.head),xcell("Sample Date",S.head),xcell("Today's Result",S.head)]);
  if(!groups.length){rows.push([xcell("No completed results",S.test),xcell("—",S.cream),xcell("—",S.cream),xcell("—",S.cream)])}
  for(const g of groups){const start=rows.length+1;for(const r of g.rows){const isSetting=g.test.startsWith("Initial");rows.push([xcell(g.test,S.test),xcell(productDisplay(r),S.cream),r.sampleDate?xdate(r.sampleDate):xcell("—",S.cream),isSetting?xcell(r.displayResult,S.cream):xcell(r.result,S.result)])}const end=rows.length;if(end>start)merges.push(`A${start}:A${end}`)}
  const z=new ZipWriter(),created=new Date().toISOString();
  z.add("[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/><Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/></Types>`);
  z.add("_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/></Relationships>`);
  z.add("docProps/core.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>Physical Test Results</dc:title><dc:creator>Sigma QC Generator</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${created}</dcterms:created></cp:coreProperties>`);
  z.add("docProps/app.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties" xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes"><Application>Sigma QC Generator</Application><HeadingPairs><vt:vector size="2" baseType="variant"><vt:variant><vt:lpstr>Worksheets</vt:lpstr></vt:variant><vt:variant><vt:i4>1</vt:i4></vt:variant></vt:vector></HeadingPairs><TitlesOfParts><vt:vector size="1" baseType="lpstr"><vt:lpstr>Physical Results</vt:lpstr></vt:vector></TitlesOfParts></Properties>`);
  z.add("xl/workbook.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView activeTab="0" firstSheet="0" showSheetTabs="1"/></bookViews><sheets><sheet name="Physical Results" sheetId="1" state="visible" r:id="rId1"/></sheets><calcPr calcMode="auto"/></workbook>`);
  z.add("xl/_rels/workbook.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`);
  z.add("xl/styles.xml",compactStylesXml());z.add("xl/worksheets/sheet1.xml",worksheetXml(rows,merges));return z.build();
}
function download(data,type,name){const a=document.createElement("a"),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}

$("#file").addEventListener("change",async e=>{const file=e.target.files?.[0];if(!file)return;$("#show").disabled=true;$("#date").disabled=true;setStatus("Reading the tracker...");try{loaded=await loadSource(file);if(!loaded.dates.length)throw Error("No completed results with valid dates were found");const d=$("#date");d.min=loaded.dates[0];d.max=loaded.dates.at(-1);d.value=loaded.dates.at(-1);d.disabled=false;$("#show").disabled=false;setStatus(`<b>${loaded.records.length}</b> samples loaded. Available dates: ${arDate(loaded.dates[0])} to ${arDate(loaded.dates.at(-1))}.`);render(collectDay(loaded,d.value))}catch(err){console.error(err);loaded=null;setStatus("Could not read the file: "+esc(err.message),true)}});
$("#show").addEventListener("click",()=>{if(!loaded)return setStatus("Select the tracker first.",true);const day=$("#date").value;if(!day)return setStatus("Select the break date.",true);render(collectDay(loaded,day))});
$("#date").addEventListener("change",()=>{if(loaded&&$("#date").value)render(collectDay(loaded,$("#date").value))});
$("#excel").addEventListener("click",()=>{if(!current)return;download(buildCompactWorkbook(current),"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",`Physical_Test_Results_${safeFile(current.day)}.xlsx`)});
$("#pdf").addEventListener("click",()=>{if(current)window.print()});
window.__sigmaTest={loadSource,collectDay,compactGroups,productDisplay,buildWorkbook:buildCompactWorkbook,dateKey};
</script>
